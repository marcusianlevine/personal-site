<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fuck Dating Apps: the field note</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Karla:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
	/* Palette: 09-palette.md (forest / ivory / gold, 2026-09-30) */
	:root {
		--forest: #1E3B2F; --forest-raised: #27473A;
		--ivory: #F4EFE3; --ivory-soft: #ECE6D6; --line: #DBD4C2;
		--ink: #17251D; --muted: #626558;
		--gold: #C8A15A; --gold-dark: #86652A;
		--blue: #335E89; --blue-dark: #254A6E; --blue-soft: #D4E4F1;
		--rose: #B9657D; --rose-dark: #984E63; --rose-soft: #F7DDE2;
		--warn: #A21B18;
	}
	@page { size: A4; margin: 12mm 13mm 15mm 13mm; }
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; background: #FFFFFF; color: var(--ink); }
	body { font-family: 'Karla', Arial, Helvetica, sans-serif; font-size: 9.6pt; line-height: 1.4; }
	.figure, .stats, .callout, .opinion, .cta, .pull { break-inside: avoid; }
	h2 { break-after: avoid; }
	h1, h2, h3, .serif { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; color: var(--forest); }
	h1 { font-size: 36pt; line-height: 1; margin: 0 0 2pt; font-weight: 600; letter-spacing: -0.005em; }
	h2 { font-size: 16.5pt; line-height: 1.12; margin: 9pt 0 3pt; font-weight: 600; }
	h2::before { content: ''; display: block; width: 26pt; height: 1.5pt; background: var(--gold); margin: 0 0 4pt; }
	.cta h2::before { display: none; }
	p { margin: 0 0 6pt; orphans: 3; widows: 3; }
	a { color: var(--gold-dark); text-decoration: none; }
	strong { font-weight: 700; }
	.rule { width: 26pt; height: 1.5pt; background: var(--gold); margin: 0 0 6pt; }
	.eyebrow { font-size: 7.8pt; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-dark); margin: 0 0 6pt; }
	.sub { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-style: italic; font-weight: 500; color: var(--gold-dark); font-size: 15pt; margin: 0 0 8pt; }
	.pull { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-style: italic; font-weight: 500; font-size: 14pt; line-height: 1.25; color: var(--forest); border-left: 3px solid var(--gold); padding-left: 10pt; margin: 7pt 0 8pt; }
	.fine { font-size: 7.4pt; color: var(--muted); line-height: 1.35; }
	.callout { background: var(--ivory-soft); border-left: 3px solid var(--blue); padding: 7pt 10pt; margin: 7pt 0 8pt; }
	.callout h3 { margin: 0 0 3pt; font-size: 14pt; font-weight: 600; color: var(--blue-dark); }
	.callout p:last-child { margin-bottom: 0; }
	.opinion { background: var(--ivory-soft); border-left: 3px solid var(--forest); padding: 7pt 10pt; margin: 7pt 0 8pt; }
	.opinion h3 { margin: 0 0 3pt; font-size: 14pt; font-weight: 600; color: var(--forest); }
	.opinion strong { color: var(--forest); }
	.opinion a { color: var(--gold-dark); }
	.opinion p { margin: 0 0 5pt; }
	.opinion p:last-child { margin: 0; }

	.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6pt; margin: 8pt 0 2pt; }
	.stat { background: var(--ivory-soft); border-top: 3px solid var(--blue); padding: 6pt 7pt 5pt; }
	.stat:last-child { border-top-color: var(--gold); }
	.stat .big { font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-weight: 600; font-size: 18pt; color: var(--blue-dark); line-height: 1.05; margin-bottom: 2pt; white-space: nowrap; }
	.stat .big.small { font-size: 15pt; }
	.stat:last-child .big { color: var(--gold-dark); }
	.stat p { font-size: 7.6pt; line-height: 1.3; margin: 0 0 2pt; }
	.stat a { font-size: 6.6pt; color: var(--muted); }

	.figure { background: var(--ivory-soft); padding: 8pt 11pt 6pt; margin: 8pt 0 4pt; }
	.figure .eyebrow { margin-bottom: 2pt; }
	.figure h3 { margin: 0 0 2pt; font-size: 15pt; font-weight: 600; }
	.figure .lede { font-size: 8.5pt; color: var(--muted); margin: 0 0 6pt; }
	.figure svg { width: 100%; height: auto; display: block; }
	.figure .cap { font-size: 8pt; color: var(--muted); margin: 5pt 0 0; }

	.cta { background: var(--forest); color: var(--ivory-soft); padding: 8pt 12pt; margin: 8pt 0 6pt; border-radius: 3pt; }
	.cta h2 { margin: 0 0 3pt; color: var(--ivory); font-size: 18pt; }
	.cta p { margin: 0 0 5pt; }
	.cta .links { display: grid; grid-template-columns: 1fr 1fr; gap: 6pt; margin-top: 4pt; }
	.cta .link { background: var(--forest-raised); border-top: 2px solid var(--gold); padding: 5pt 9pt; border-radius: 2pt; }
	.cta .link b { display: block; font-size: 9pt; color: var(--gold); }
	.cta .link span { font-size: 8.6pt; }
	.cta a { color: var(--ivory); }

	ul { margin: 0 0 6pt; padding-left: 14pt; }
	li { margin: 0 0 3.5pt; break-inside: avoid; }
	li::marker { color: var(--blue); }
	.callout ul, .opinion ul { margin-bottom: 0; }
	.callout li, .opinion li { margin-bottom: 3pt; }
	.opinion li::marker { color: var(--forest); }
	table.grid { width: 100%; border-collapse: collapse; margin: 4pt 0 8pt; font-size: 8.4pt; line-height: 1.3; break-inside: avoid; }
	table.grid th { text-align: left; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-weight: 600; font-size: 10.5pt; color: var(--forest); padding: 3pt 6pt 3pt 0; border-bottom: 1.5px solid var(--gold); }
	table.grid td { vertical-align: top; padding: 4pt 6pt 4pt 0; border-bottom: 1px solid var(--line); }
	table.grid td:last-child, table.grid th:last-child { padding-right: 0; }
	table.grid.log td { height: 26pt; }
	table.grid.log th:nth-child(1) { width: 9%; }
	table.grid.log th:nth-child(2) { width: 8%; }
	table.grid.log th:nth-child(3), table.grid.log th:nth-child(4) { width: 31%; }
	table.grid.log th:nth-child(5) { width: 21%; white-space: nowrap; }
		table.grid.log { margin-bottom: 4pt; }
	.page-break { break-before: page; }
	.two-col > .callout, .two-col > .opinion { margin: 0; }
	.two-col { margin: 7pt 0 8pt; align-items: stretch; }
	.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
</style>
</head>
<body>

<div class="rule"></div>
<h1>{{title}}</h1>
<p class="sub">{{tagline}}</p>

{{opening}}

<div class="figure">
	<p class="eyebrow">Apps vs. in person</p>
	<h3>{{stages_title}}</h3>
	{{stages_lede}}
	<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" font-family="'Karla', Arial, sans-serif">
		<defs>
			<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 8 4 L 0 8 z" fill="#626558" />
			</marker>
		</defs>
		<!-- lane 1: the apps (muted: the trap) -->
		<text x="8" y="14" font-size="12.5" font-weight="700" fill="#626558">On the apps</text>
		<text x="92" y="14" font-size="11" fill="#626558">weeks, and what it trains is writing a profile</text>
		<g>
			<rect x="8" y="24" width="136" height="54" rx="6" fill="#E4E1D6" />
			<text x="76" y="47" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Swipe</text>
			<text x="76" y="65" text-anchor="middle" fill="#626558" font-size="11">hours a week</text>
			<text x="151" y="56" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="158" y="24" width="136" height="54" rx="6" fill="#E4E1D6" />
			<text x="226" y="47" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Match</text>
			<text x="226" y="65" text-anchor="middle" fill="#626558" font-size="11">1 in 50 swipes (men)</text>
			<text x="301" y="56" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="308" y="24" width="136" height="54" rx="6" fill="#E4E1D6" />
			<text x="376" y="47" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Text</text>
			<text x="376" y="65" text-anchor="middle" fill="#626558" font-size="11">days</text>
			<text x="451" y="56" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="458" y="24" width="136" height="54" rx="6" fill="#E4E1D6" />
			<text x="526" y="47" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Schedule</text>
			<text x="526" y="65" text-anchor="middle" fill="#626558" font-size="11">a week, if it happens</text>
			<text x="601" y="56" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="608" y="24" width="136" height="54" rx="6" fill="#8F9283" />
			<text x="676" y="47" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">First date</text>
			<text x="676" y="65" text-anchor="middle" fill="#FFFFFF" font-size="11">finally find out</text>
		</g>
		<!-- the loop back to swiping -->
		<path d="M 376 78 v 14 H 76 v -10" fill="none" stroke="#626558" stroke-width="1.4" stroke-dasharray="3 2.5" marker-end="url(#arr)" />
		<text x="226" y="106" text-anchor="middle" font-size="11" fill="#626558" font-weight="700">Most matches never become a date. Back to swiping.</text>
		<!-- lane 2: in person (brand: forest + gold) -->
		<text x="8" y="134" font-size="12.5" font-weight="700" fill="#1E3B2F">In person</text>
		<text x="78" y="134" font-size="11" fill="#626558">minutes, and every step trains a skill you keep</text>
		<g>
			<rect x="8" y="144" width="136" height="54" rx="6" fill="#FFFFFF" stroke="#C8A15A" stroke-width="1.2" />
			<text x="76" y="167" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Notice her</text>
			<text x="76" y="185" text-anchor="middle" fill="#86652A" font-size="11">now</text>
			<text x="151" y="176" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="158" y="144" width="136" height="54" rx="6" fill="#FFFFFF" stroke="#C8A15A" stroke-width="1.2" />
			<text x="226" y="167" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Say hello</text>
			<text x="226" y="185" text-anchor="middle" fill="#86652A" font-size="11">10 seconds</text>
			<text x="301" y="176" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="308" y="144" width="136" height="54" rx="6" fill="#FFFFFF" stroke="#C8A15A" stroke-width="1.2" />
			<text x="376" y="167" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Talk</text>
			<text x="376" y="185" text-anchor="middle" fill="#86652A" font-size="11">a minute or so</text>
			<text x="451" y="176" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="458" y="144" width="136" height="54" rx="6" fill="#FFFFFF" stroke="#C8A15A" stroke-width="1.2" />
			<text x="526" y="167" text-anchor="middle" fill="#17251D" font-size="13" font-weight="700">Say what you want</text>
			<text x="526" y="185" text-anchor="middle" fill="#86652A" font-size="11">30 seconds</text>
			<text x="601" y="176" text-anchor="middle" fill="#626558" font-size="14">›</text>
			<rect x="608" y="144" width="136" height="54" rx="6" fill="#1E3B2F" />
			<text x="676" y="167" text-anchor="middle" fill="#F4EFE3" font-size="13" font-weight="700">First date</text>
			<text x="676" y="185" text-anchor="middle" fill="#C8A15A" font-size="11">you already know</text>
		</g>
		<!-- the freeze marker -->
		<line x1="226" y1="200" x2="226" y2="212" stroke="#1E3B2F" stroke-width="1.6" />
		<text x="226" y="227" text-anchor="middle" font-size="11" fill="#1E3B2F" font-weight="700" font-style="italic">the freeze hits here</text>
	</svg>
	{{stages_caption}}
</div>

{{sections}}

<div class="cta">
	<h2>{{cta_title}}</h2>
	{{cta_body}}
	<div class="links">
{{cta_links}}
	</div>
</div>

{{sources}}

</body>
</html>
